[project]
name = "sample"
version = "0.1.0"
description = "Sieve of Eratosthenes implemented in C++ (sample project)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[build-system]
requires = ["scikit-build-core>=1.1.1", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/sample"]
cmake.version = ">=3.15"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.uv]
# C++ 変更時に uv sync で再ビルドさせる
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "src/**/*.cpp" },
  { file = "src/**/*.hpp" },
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *_i686"
build-frontend = "build[uv]"
test-requires = ["pytest"]
test-command = "pytest {project}/tests/python"

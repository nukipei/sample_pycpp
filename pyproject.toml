[project]
name = "sample"
version = "0.1.0"
description = "Sieve of Eratosthenes implemented in C++ (sample project)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[build-system]
requires = ["scikit-build-core>=1.1.1", "nanobind>=3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/sample"]
# Python 3.12 以降は abi3 wheel を共用（3.11 は通常の cp311 wheel）
wheel.py-api = "cp312"
cmake.version = ">=3.26"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.uv]
# C++ 変更時に uv sync で再ビルドさせる
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "src/**/*.cpp" },
  { file = "src/**/*.hpp" },
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp314t-*"
skip = "*-musllinux_* *-win32 *_i686"
build-frontend = "build[uv]"
test-requires = ["pytest"]
test-command = "pytest {project}/tests/python"

[tool.cibuildwheel.linux]
# 社内プロキシ / PyPI ミラーの設定をビルドコンテナへ引き継ぐ（未設定の変数は無視される）
environment-pass = [
  "HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY",
  "http_proxy", "https_proxy", "no_proxy",
  "UV_DEFAULT_INDEX", "PIP_INDEX_URL",
]
